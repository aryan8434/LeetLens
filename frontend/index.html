<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta
      name="description"
      content="LeetLens is the ultimate LeetCode Profile Analyzer & Optimizer. Analyze your LeetCode profile, track coding statistics, get FAANG company readiness scores, and get a personalized AI evaluation report."
    />
    <meta
      name="keywords"
      content="leetcode profile analyzer, leetcode, leetcode profile, leetlens, leetcode analyzer, leetcode optimizer, coding profile analyzer, FAANG preparation, DSA analysis, interview readiness score"
    />
    <meta name="theme-color" content="#ff6a00" />
    <meta name="author" content="LeetLens Team" />

    <!-- Installable PWA / mobile app metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="LeetLens" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LeetLens" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="LeetLens - LeetCode Profile Analyzer & Optimizer"
    />
    <meta
      property="og:description"
      content="Optimize your LeetCode profile with advanced DSA analytics, FAANG readiness metrics, and AI-powered interview evaluations."
    />
    <meta property="og:url" content="https://leetlens.tech" />
    <meta property="og:image" content="https://leetlens.tech/logo.png" />
    <meta property="og:image:alt" content="LeetLens — LeetCode profile analyzer and AI interview readiness coach" />
    <meta property="og:site_name" content="LeetLens" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="LeetLens - LeetCode Profile Analyzer & Optimizer"
    />
    <meta
      name="twitter:description"
      content="Optimize your LeetCode profile with advanced DSA analytics, FAANG readiness metrics, and AI-powered interview evaluations."
    />
    <meta name="twitter:image" content="https://leetlens.tech/logo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://leetlens.tech" />

    <!-- Preload Critical Resources -->
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/icon.svg" as="image" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.ipify.org" />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LeetLens",
        "description": "Advanced LeetCode Profile Analyzer and AI DSA Coach with company readiness metrics, resume-to-JD matching, and a personalized preparation roadmap.",
        "url": "https://leetlens.tech",
        "image": "https://leetlens.tech/logo.png",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern web browser with JavaScript enabled",
        "featureList": [
          "LeetCode profile analytics (solved counts, streaks, difficulty split, topic coverage)",
          "AI evaluation report with an overall skill score and company-wise interview readiness",
          "Resume and job-description ATS matcher",
          "Personalized 6-month preparation roadmap",
          "FAANG readiness scoring"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Razorpay Standard Checkout SDK (deferred: only needed at checkout, so it
         must not block first paint) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8662840338181469"
         crossorigin="anonymous"></script>

    <title>
      LeetLens - LeetCode Profile Analyzer & Optimizer | AI DSA Coach
    </title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" async></script>
  </body>
</html>
