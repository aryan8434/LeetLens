<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta
      name="description"
      content="LeetLens - Track your LeetCode progress with AI-powered evaluation. Analyze your coding skills, get hiring insights, and improve your DSA foundation."
    />
    <meta
      name="keywords"
      content="LeetCode, coding interview, DSA, data structures, algorithms, progress tracker, AI evaluation, interview preparation"
    />
    <meta name="theme-color" content="#ff6a00" />
    <meta name="author" content="LeetLens Team" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="LeetLens - LeetCode Progress Tracker & AI Evaluation"
    />
    <meta
      property="og:description"
      content="Track your coding progress with advanced analytics and get AI-powered interview readiness evaluation."
    />
    <meta property="og:url" content="https://leetlens.teth.app" />
    <meta property="og:image" content="https://leetlens.teth.app/logo.png" />
    <meta property="og:site_name" content="LeetLens" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="LeetLens - Track Your LeetCode Progress"
    />
    <meta
      name="twitter:description"
      content="Advanced LeetCode analytics and AI-powered interview readiness evaluation."
    />
    <meta name="twitter:image" content="https://leetlens.teth.app/logo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://leetlens.teth.app" />

    <!-- Preload Critical Resources -->
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/icon.svg" as="image" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.ipify.org" />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LeetLens",
        "description": "Advanced LeetCode progress tracker with AI-powered interview readiness evaluation",
        "url": "https://leetlens.teth.app",
        "applicationCategory": "EducationalApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <title>
      LeetLens - LeetCode Progress Tracker & AI Interview Evaluation
    </title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" async></script>
  </body>
</html>
